# Publishes n26-mcp to PyPI when a GitHub Release is published.
# It does not run on pull requests or on ordinary pushes.
# Create the PyPI project and a GitHub environment named "pypi" (trusted
# publishing) before you publish a release. Until then, this file does nothing.

name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
